<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文件仓库</title>
    <style>
        /* 样式与之前保持一致，兼容老设备 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a2332;
            padding: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
        .container {
            max-width: 780px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #0d1829;
            padding-bottom: 6px;
            border-bottom: 2px solid #e8ecf1;
            margin-bottom: 20px;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #5e6f8d;
        }
        .info-box {
            background: #f0f4fe;
            border-left: 4px solid #2d7aff;
            padding: 12px 16px;
            margin-bottom: 18px;
            border-radius: 4px;
            font-size: 15px;
            color: #1a3a6b;
        }
        .info-box strong {
            color: #0d2952;
        }
        .status {
            margin: 14px 0 10px 0;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 15px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.loading {
            background: #eef3fa;
            color: #1a3a6b;
            border: 1px solid #c8d6e8;
        }
        .status.success {
            background: #e6f7ed;
            color: #0d4a2a;
            border: 1px solid #b3dfc7;
        }
        .status.error {
            background: #feeceb;
            color: #7a1a1a;
            border: 1px solid #f5c6c4;
        }
        .file-table-wrap {
            margin-top: 16px;
            overflow-x: auto;
        }
        table.file-list {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        table.file-list th {
            text-align: left;
            background: #eef3fa;
            padding: 10px 12px;
            border-bottom: 2px solid #ccd4e0;
            font-weight: 600;
            color: #1a2a44;
        }
        table.file-list td {
            padding: 10px 12px;
            border-bottom: 1px solid #e6ecf3;
            vertical-align: middle;
        }
        table.file-list tr:hover {
            background: #f6f9fc;
        }
        .file-name {
            font-weight: 500;
            color: #0d1829;
            word-break: break-all;
        }
        .file-size {
            color: #5e6f8d;
            font-size: 14px;
            white-space: nowrap;
        }
        .file-download {
            text-align: right;
            white-space: nowrap;
        }
        .btn {
            display: inline-block;
            padding: 4px 16px;
            background: #2d7aff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            vertical-align: middle;
        }
        .btn:hover {
            background: #1a5fd9;
        }
        .footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid #e8ecf1;
            font-size: 14px;
            color: #6c7a92;
            text-align: center;
        }
        .footer a {
            color: #2d7aff;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
                font-size: 15px;
            }
            .container {
                padding: 16px 14px;
            }
            h1 {
                font-size: 22px;
            }
            table.file-list th,
            table.file-list td {
                padding: 8px 8px;
                font-size: 14px;
            }
        }
        @media (max-width: 360px) {
            body {
                padding: 6px;
                font-size: 14px;
            }
            .container {
                padding: 12px 10px;
            }
            h1 {
                font-size: 19px;
            }
            table.file-list th,
            table.file-list td {
                padding: 6px 5px;
                font-size: 13px;
            }
            .btn {
                font-size: 12px;
                padding: 3px 10px;
            }
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: #6c7a92;
        }
        .mt-10 {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            📦 我的文件仓库
            <small>从 GitHub 自动加载</small>
        </h1>

        <div class="info-box">
            <strong>📌 说明：</strong>
            页面会自动加载下方配置的 GitHub 仓库中的文件列表。
            点击文件名或「下载」按钮即可下载文件。
        </div>

        <!-- ===== 状态信息 ===== -->
        <div id="status" class="status"></div>

        <!-- ===== 文件列表 ===== -->
        <div id="fileListWrap" class="file-table-wrap hidden">
            <table class="file-list" id="fileTable">
                <thead>
                    <tr>
                        <th style="width:50%;">文件名</th>
                        <th style="width:20%;">大小</th>
                        <th style="width:30%;text-align:right;">操作</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                    <!-- 由 JS 动态填充 -->
                </tbody>
            </table>
            <div class="text-center mt-10 text-muted" style="font-size:14px;">
                💡 点击文件名或「下载」按钮即可下载文件
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer">
            <span>📎 数据来源：GitHub API &nbsp;·&nbsp; 兼容老设备 </span>
            <br>
            <span style="font-size:13px;">
                部署于 <a href="https://pages.cloudflare.com/" target="_blank">Cloudflare Pages</a>
                &nbsp;·&nbsp; 源码在 <a href="#" id="repoLink" target="_blank">GitHub</a>
            </span>
        </div>
    </div>

    <script>
        /* ============================================================
           ★★★ 仓库配置 - 在这里填写你的 GitHub 信息 ★★★
           ============================================================ */
        var REPO_OWNER = 'zjknb';  // 改成你的 GitHub 用户名
        var REPO_NAME = 'file';        // 改成你的仓库名称
        var REPO_BRANCH = 'main';            // 分支名称，通常是 main 或 master

        /* ============================================================
           以下代码无需修改，会自动加载上面配置的仓库
           ============================================================ */

        var statusEl = document.getElementById('status');
        var fileListWrap = document.getElementById('fileListWrap');
        var fileTableBody = document.getElementById('fileTableBody');
        var repoLinkEl = document.getElementById('repoLink');

        // 更新底部仓库链接
        function updateRepoLink() {
            if (REPO_OWNER && REPO_NAME && REPO_OWNER !== '你的GitHub用户名' && REPO_NAME !== '你的仓库名') {
                repoLinkEl.href = 'https://github.com/' + REPO_OWNER + '/' + REPO_NAME;
                repoLinkEl.textContent = REPO_OWNER + '/' + REPO_NAME;
            } else {
                repoLinkEl.href = '#';
                repoLinkEl.textContent = 'GitHub';
            }
        }
        updateRepoLink();

        // 显示状态信息
        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status show ' + (type || '');
            if (type === 'success') {
                clearTimeout(statusEl._timer);
                statusEl._timer = setTimeout(function() {
                    statusEl.className = 'status';
                }, 5000);
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            var units = ['B', 'KB', 'MB', 'GB'];
            var k = 1024;
            var i = 0;
            while (bytes >= k && i < units.length - 1) {
                bytes /= k;
                i++;
            }
            return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
        }

        // 从 GitHub 加载文件列表
        function loadFiles() {
            var owner = REPO_OWNER.trim();
            var repo = REPO_NAME.trim();
            var branch = REPO_BRANCH.trim() || 'main';

            if (!owner || !repo || owner === '你的GitHub用户名' || repo === '你的仓库名') {
                showStatus('⚠️ 请先在代码顶部的「仓库配置」区域填写你的 GitHub 用户名和仓库名。', 'error');
                return;
            }

            var apiUrl = 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' +
                encodeURIComponent(repo) + '/contents/?ref=' + encodeURIComponent(branch);

            showStatus('⏳ 正在从 GitHub 加载文件列表...', 'loading');

            fileTableBody.innerHTML = '';
            fileListWrap.className = 'file-table-wrap hidden';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', apiUrl, true);
            xhr.setRequestHeader('Accept', 'application/vnd.github.v3+json');
            xhr.timeout = 15000;

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (Array.isArray(data)) {
                            var files = data.filter(function(item) {
                                return item.type === 'file';
                            });
                            if (files.length === 0) {
                                showStatus('⚠️ 该仓库根目录下没有文件。', 'error');
                                return;
                            }
                            renderFileList(files, owner, repo, branch);
                            showStatus('✅ 成功加载 ' + files.length + ' 个文件', 'success');
                        } else {
                            if (data.message) {
                                showStatus('❌ GitHub API 错误：' + data.message, 'error');
                            } else {
                                showStatus('❌ 返回数据格式异常。', 'error');
                            }
                        }
                    } catch (e) {
                        showStatus('❌ 解析数据失败：' + e.message, 'error');
                    }
                } else if (xhr.status === 404) {
                    showStatus('❌ 仓库或分支不存在，请检查仓库名和分支是否正确。', 'error');
                } else if (xhr.status === 403) {
                    showStatus('❌ API 访问限制，请稍后再试。', 'error');
                } else {
                    showStatus('❌ 加载失败 (HTTP ' + xhr.status + ')。', 'error');
                }
            };

            xhr.onerror = function() {
                showStatus('❌ 网络请求失败，请检查网络连接。', 'error');
            };

            xhr.ontimeout = function() {
                showStatus('❌ 请求超时，请稍后重试。', 'error');
            };

            xhr.send();
        }

        // 渲染文件列表
        function renderFileList(files, owner, repo, branch) {
            var tbody = fileTableBody;
            tbody.innerHTML = '';

            for (var i = 0; i < files.length; i++) {
                var file = files[i];
                var fileName = file.name || '未命名';
                var fileSize = file.size || 0;
                var sizeStr = formatFileSize(fileSize);
                var rawUrl = 'https://raw.githubusercontent.com/' + encodeURIComponent(owner) + '/' +
                    encodeURIComponent(repo) + '/' + encodeURIComponent(branch) + '/' +
                    encodeURIComponent(fileName);

                var tr = document.createElement('tr');

                var tdName = document.createElement('td');
                var nameLink = document.createElement('a');
                nameLink.href = rawUrl;
                nameLink.target = '_blank';
                nameLink.className = 'file-name';
                nameLink.textContent = fileName;
                tdName.appendChild(nameLink);

                var tdSize = document.createElement('td');
                tdSize.className = 'file-size';
                tdSize.textContent = sizeStr;

                var tdAction = document.createElement('td');
                tdAction.className = 'file-download';
                var downloadBtn = document.createElement('a');
                downloadBtn.href = rawUrl;
                downloadBtn.target = '_blank';
                downloadBtn.className = 'btn';
                downloadBtn.textContent = '⬇ 下载';
                tdAction.appendChild(downloadBtn);

                tr.appendChild(tdName);
                tr.appendChild(tdSize);
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            }

            fileListWrap.className = 'file-table-wrap';
        }

        // 页面加载后自动加载文件
        window.onload = function() {
            loadFiles();
        };
    </script>
</body>
</html>
